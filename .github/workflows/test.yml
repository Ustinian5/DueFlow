name: test

on:
  push:
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python package metadata
        run: python -m pip install --dry-run .

      - name: Run Python tests
        env:
          LLM_PROVIDER: mock
        run: python -m pytest

  desktop:
    name: Desktop frontend and smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop frontend
        working-directory: desktop
        run: npm run build

      - name: Run desktop runtime tests
        working-directory: desktop
        run: npm run test:runtime

      - name: Run desktop smoke test
        working-directory: desktop
        env:
          LLM_PROVIDER: mock
        run: npm run test:smoke

      - name: Run release script unit tests
        working-directory: desktop
        run: |
          npm run test:preflight
          npm run test:release-manifest

  tauri:
    name: Tauri Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Check formatting
        working-directory: desktop/src-tauri
        run: cargo fmt --check

      - name: Check Rust
        working-directory: desktop/src-tauri
        run: cargo check

      - name: Run Rust tests
        working-directory: desktop/src-tauri
        run: cargo test
