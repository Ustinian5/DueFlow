[package]
name = "dueflow_desktop"
version = "0.1.1"
description = "DueFlow Desktop local DDL assistant"
authors = ["DueFlow Contributors"]
license = "MIT"
homepage = "https://github.com/Ustinian5/DueFlow#readme"
repository = "https://github.com/Ustinian5/DueFlow"
readme = "../../README.md"
edition = "2021"

[lib]
name = "dueflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dueflow-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
