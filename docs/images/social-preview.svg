<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">DueFlow social preview</title>
  <desc id="desc">DueFlow turns scattered deadline information into an actionable local-first schedule.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="0.58" stop-color="#11141c"/>
      <stop offset="1" stop-color="#17131a"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="14%" r="72%">
      <stop offset="0" stop-color="#ff4b5c" stop-opacity="0.30"/>
      <stop offset="0.42" stop-color="#ff4b5c" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff4b5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4b5c"/>
      <stop offset="1" stop-color="#ff6c78"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1160" cy="-30" r="210" fill="#ff4b5c" opacity="0.05"/>
  <circle cx="55" cy="620" r="170" fill="#f4d7a3" opacity="0.035"/>

  <g transform="translate(66 54)">
    <rect x="0" y="0" width="84" height="84" rx="25" fill="#f7e7c7"/>
    <path d="M12 22L24 3l20 16M72 22L60 3 40 19" fill="#efbd72" stroke="#efbd72" stroke-width="9" stroke-linejoin="round"/>
    <rect x="13" y="18" width="58" height="57" rx="23" fill="#f7e7c7"/>
    <path d="M25 47c0-7 5-11 10-11s10 4 10 11M49 47c0-7 5-11 10-11s10 4 10 11" fill="none" stroke="#242832" stroke-width="5" stroke-linecap="round"/>
    <circle cx="24" cy="55" r="5" fill="#f29da1"/>
    <circle cx="60" cy="55" r="5" fill="#f29da1"/>
    <path d="M34 59c4 6 12 6 16 0" fill="none" stroke="#242832" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="170" y="108" fill="#ffffff" font-family="Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1">DueFlow</text>
  <text x="171" y="136" fill="#9ea5b3" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2">OPEN SOURCE · LOCAL FIRST</text>

  <text x="66" y="236" fill="#ffffff" font-family="Helvetica Neue, Arial, sans-serif" font-size="54" font-weight="750" letter-spacing="-2">Deadlines in.</text>
  <text x="66" y="302" fill="#ffffff" font-family="Helvetica Neue, Arial, sans-serif" font-size="54" font-weight="750" letter-spacing="-2">Actionable plans out.</text>
  <text x="68" y="354" fill="#b9bfca" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="400">Turn scattered notices into a reverse schedule,</text>
  <text x="68" y="385" fill="#b9bfca" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="400">risk checks, and calendar-ready next actions.</text>

  <g font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="66" y="438" width="166" height="42" rx="21" fill="#1b1f29" stroke="#343946"/>
    <circle cx="87" cy="459" r="5" fill="#ff4b5c"/>
    <text x="102" y="465" fill="#e8eaf0">OCR-ready intake</text>
    <rect x="242" y="438" width="178" height="42" rx="21" fill="#1b1f29" stroke="#343946"/>
    <circle cx="263" cy="459" r="5" fill="#f4d7a3"/>
    <text x="278" y="465" fill="#e8eaf0">Reverse schedules</text>
    <rect x="66" y="492" width="146" height="42" rx="21" fill="#1b1f29" stroke="#343946"/>
    <circle cx="87" cy="513" r="5" fill="#7bd9a5"/>
    <text x="102" y="519" fill="#e8eaf0">Risk checks</text>
    <rect x="222" y="492" width="127" height="42" rx="21" fill="#1b1f29" stroke="#343946"/>
    <circle cx="243" cy="513" r="5" fill="#8bb9ff"/>
    <text x="258" y="519" fill="#e8eaf0">ICS export</text>
  </g>
  <text x="68" y="584" fill="#7f8796" font-family="Helvetica Neue, Arial, sans-serif" font-size="18">Runs on your Mac. Your schedule stays local.</text>

  <g filter="url(#shadow)">
    <rect x="700" y="54" width="514" height="532" rx="28" fill="#171a22" stroke="#343945" stroke-width="2"/>
    <path d="M700 115h514" stroke="#343945" stroke-width="2"/>
    <circle cx="734" cy="85" r="7" fill="#ff6b72"/>
    <circle cx="758" cy="85" r="7" fill="#f2c96d"/>
    <circle cx="782" cy="85" r="7" fill="#71d596"/>
    <text x="815" y="92" fill="#aab0bc" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600">Today · DueFlow</text>
    <rect x="1092" y="72" width="88" height="28" rx="14" fill="#26372f"/>
    <circle cx="1110" cy="86" r="5" fill="#71d596"/>
    <text x="1123" y="92" fill="#a9e5bf" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700">LOCAL</text>

    <text x="738" y="160" fill="#9da4b1" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">NEXT DEADLINE</text>
    <text x="738" y="204" fill="#ffffff" font-family="Helvetica Neue, Arial, sans-serif" font-size="31" font-weight="700">Course project</text>
    <rect x="1027" y="168" width="151" height="42" rx="21" fill="#332027" stroke="#69313a"/>
    <text x="1049" y="195" fill="#ff8c96" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700">FRI · 23:59</text>
    <text x="738" y="233" fill="#7f8795" font-family="Helvetica Neue, Arial, sans-serif" font-size="16">7-day reverse plan · 4 milestones</text>

    <rect x="738" y="263" width="440" height="132" rx="18" fill="#11141b" stroke="#2c313d"/>
    <path d="M786 322H1127" stroke="#3a404d" stroke-width="4" stroke-linecap="round"/>
    <path d="M786 322H1009" stroke="url(#button)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="786" cy="322" r="10" fill="#ff4b5c"/>
    <circle cx="900" cy="322" r="10" fill="#ff5e6c"/>
    <circle cx="1013" cy="322" r="10" fill="#ff7883"/>
    <circle cx="1127" cy="322" r="10" fill="#242a35" stroke="#697180" stroke-width="3"/>
    <g fill="#b8bec9" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      <text x="786" y="358">Outline</text>
      <text x="900" y="358">Draft</text>
      <text x="1013" y="358">Review</text>
      <text x="1127" y="358">Submit</text>
    </g>

    <rect x="738" y="417" width="440" height="72" rx="18" fill="#17231e" stroke="#2a4a3a"/>
    <circle cx="773" cy="453" r="16" fill="#254c38"/>
    <path d="M765 453l6 6 11-14" fill="none" stroke="#78daa1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="806" y="447" fill="#d6f1e0" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700">Risk check passed</text>
    <text x="806" y="470" fill="#8fb59f" font-family="Helvetica Neue, Arial, sans-serif" font-size="14">No deadline conflicts in this plan</text>

    <rect x="738" y="509" width="282" height="46" rx="14" fill="#222631" stroke="#3b414e"/>
    <text x="763" y="538" fill="#d4d8df" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600">Calendar event ready</text>
    <rect x="1034" y="509" width="144" height="46" rx="14" fill="url(#button)"/>
    <text x="1065" y="538" fill="#ffffff" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700">Export .ics</text>
  </g>
</svg>
